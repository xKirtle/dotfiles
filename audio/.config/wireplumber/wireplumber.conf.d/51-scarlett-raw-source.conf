# Scarlett Solo 4th Gen: the raw 4-channel capture device ("split parent") that the
# per-input sources (Input 1 Inst/Line, Input 2 Mic, Monitor 3+4) are carved out of.
# Recording from it mixes all inputs together, so label it clearly and never make it
# the default input. It can't be disabled: the per-input sources depend on it.
monitor.alsa.rules = [
  {
    matches = [
      { node.name = "alsa_input.hw_Gen_0" }
    ]
    actions = {
      update-props = {
        node.description = "Scarlett Solo (raw, all inputs mixed)"
        priority.session = 1
      }
    }
  }
]
