# Inputs I don't use, hidden from every app.
monitor.alsa.rules = [
  {
    # Scarlett "Monitor Input 3+4": loopback of what the PC plays through the interface
    matches = [
      { node.name = "alsa_input.usb-Focusrite_Scarlett_Solo_4th_Gen_S14AD9G3B27480-00.HiFi__Line2__source" }
    ]
    actions = {
      update-props = {
        node.disabled = true
      }
    }
  }
  {
    # Webcam's built-in microphone (audio side only; the camera's video is a separate device)
    matches = [
      { device.name = "alsa_card.usb-Sonix_Technology_Co.__Ltd._Angetube_Live_Camera_SN0001-02" }
    ]
    actions = {
      update-props = {
        device.disabled = true
      }
    }
  }
]
