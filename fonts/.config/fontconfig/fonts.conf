<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!-- Subpixel-free grayscale AA with slight hinting -->
  <match target="font">
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
    <edit name="hinting" mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintslight</const></edit>
    <edit name="rgba" mode="assign"><const>none</const></edit>
    <edit name="lcdfilter" mode="assign"><const>lcddefault</const></edit>
  </match>

  <alias><family>sans-serif</family>
    <prefer><family>Inter</family><family>Noto Sans</family><family>Noto Sans CJK JP</family><family>Noto Color Emoji</family></prefer>
  </alias>
  <alias><family>serif</family>
    <prefer><family>Noto Serif</family><family>Noto Serif CJK JP</family><family>Noto Color Emoji</family></prefer>
  </alias>
  <alias><family>monospace</family>
    <prefer><family>JetBrainsMono Nerd Font</family><family>Noto Sans Mono</family><family>Noto Color Emoji</family></prefer>
  </alias>
  <alias><family>emoji</family>
    <prefer><family>Noto Color Emoji</family></prefer>
  </alias>
</fontconfig>
